# Configuracao do Cloudflare Tunnel para expor o MCP server da Vizzion em HTTPS.
# Pre-reqs: cloudflared instalado e um tunnel criado (cloudflared tunnel create <nome>).
# Domínio deve estar no seu Cloudflare e apontar para este tunnel.
#
# Execucao:
#   cloudflared tunnel --config mcp-server/cloudflare-tunnel.yml run
#
# Alternativa fixa (sem tunnel): use o Cloudflare Worker em mcp-worker.js
#   1. Instale wrangler: npm install -g wrangler
#   2. wrangler login
#   3. Defina wrangler.toml MCP_BACKEND_URL para a URL do seu MCP (ex: http://localhost:8787 ou URL do tunnel)
#   4. wrangler deploy
#   5. No painel Vizzion (Configuracoes), defina URL do MCP como https://<seu-worker>.workers.dev/mcp
#
# O Worker e um proxy reverso fixo: nao expõe o localhost diretamente, ele encaminha
# requisicoes MCP para o backend configurado em MCP_BACKEND_URL.

tunnel: vizzion-mcp
credentials-file: ./vizzion-mcp.json

ingress:
  - hostname: mcp.vizzion.com.br
    service: http://localhost:8787
  - service: http_status:404
